<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Tiqo</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f1f3f6;
        color: #0e1420;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0f16;
          color: #e8ecf1;
        }
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        opacity: 0.7;
        max-width: 32ch;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>No connection</h1>
      <p>Tiqo needs the network to show the queue. It will load as soon as you are back online.</p>
    </div>
  </body>
</html>
