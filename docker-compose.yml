services:
  postgres:
    image: postgres:17-alpine
    container_name: tiqo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiqo
      POSTGRES_PASSWORD: tiqo_dev_password
      POSTGRES_DB: tiqo
    ports:
      - "5433:5432"
    volumes:
      - tiqo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiqo -d tiqo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tiqo-pgdata:
